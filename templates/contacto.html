{% extends "base.html" %}

{% block title %}Contacto{% endblock %}

{% block content %}
<div class="text-center mb-5">
    <h2>Contáctanos</h2>
    <p class="lead">Escríbenos y responderemos a la brevedad.</p>
</div>

<form>
    <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="nombre" placeholder="Tu nombre">
    </div>
    <div class="mb-3">
        <label for="correo" class="form-label">Correo Electrónico</label>
        <input type="email" class="form-control" id="correo" placeholder="Tu correo">
    </div>
    <div class="mb-3">
        <label for="mensaje" class="form-label">Mensaje</label>
        <textarea class="form-control" id="mensaje" rows="4" placeholder="Escribe tu mensaje"></textarea>
    </div>
    <button type="submit" class="btn btn-custom">Enviar</button>
</form>
{% endblock %}
