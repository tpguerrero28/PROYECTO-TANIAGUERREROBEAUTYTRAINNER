<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listado de Productos</title>
</head>
<body>
    <h1>Productos</h1>
    <a href="{{ url_for('nuevo_producto') }}">Nuevo Producto</a>
    <table border="1" cellpadding="5">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
        </tr>
        {% for p in productos %}
        <tr>
            <td>{{ p['id_producto'] }}</td>
            <td>{{ p['nombre'] }}</td>
            <td>${{ "%.2f"|format(p['precio']) }}</td>
            <td>{{ p['stock'] }}</td>
            <td>
                <a href="{{ url_for('editar_producto', id_producto=p['id_producto']) }}">Editar</a>
                <form action="{{ url_for('eliminar_producto_ruta', id_producto=p['id_producto']) }}" method="post" style="display:inline;">
                    <button type="submit">Eliminar</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
    <a href="{{ url_for('productos_pdf') }}">Descargar PDF</a>
</body>
</html>
