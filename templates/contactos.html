<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Solicita tu cita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f9c0d9, #a3d5ff);
            font-family: Arial, sans-serif;
        }

        .form-card {
            background: rgba(255, 230, 240, 0.8);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
        }

        .form-card h2 {
            color: #d63384;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-control {
            border-radius: 15px;
            height: 50px;
            font-size: 1rem;
        }

        .form-select {
            border-radius: 15px;
            height: 50px;
            font-size: 1rem;
        }

        .btn-submit {
            background-color: #d63384;
            color: white;
            font-weight: bold;
            border-radius: 15px;
            height: 50px;
            width: 100%;
            font-size: 1.1rem;
        }

        .btn-submit:hover {
            background-color: #b02670;
        }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>📞 Solicita tu cita</h2>
        <form method="POST">
            <div class="mb-3">
                <input type="text" class="form-control" name="nombre" placeholder="Nombre completo" required>
            </div>
            <div class="mb-3">
                <input type="tel" class="form-control" name="celular" placeholder="Celular" required>
            </div>
            <div class="mb-3">
                <input type="email" class="form-control" name="email" placeholder="Correo electrónico" required>
            </div>
            <div class="mb-3">
                <select class="form-select" name="servicio" required>
                    <option value="" disabled selected>Servicio que deseas</option>
                    <option value="maquillaje">Maquillaje y Peinado</option>
                    <option value="asesoria">Asesoría Personalizada</option>
                    <option value="tratamiento">Tratamientos Capilares</option>
                </select>
            </div>
            <div class="row mb-4">
                <div class="col-md-6 mb-3 mb-md-0">
                    <input type="date" class="form-control" name="fecha" required>
                </div>
                <div class="col-md-6">
                    <input type="time" class="form-control" name="hora" required>
                </div>
            </div>
            <button type="submit" class="btn btn-submit">Enviar solicitud</button>
        </form>
    </div>
</body>
</html>
