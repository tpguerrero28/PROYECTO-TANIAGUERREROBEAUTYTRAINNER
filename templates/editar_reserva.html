{% extends "base.html" %}

{% block title %}Editar Reserva{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="mb-4 text-center">Editar Reserva</h2>

    <form method="POST" action="{{ url_for('editar_reserva', id=reserva.id_reserva) }}">
        <div class="mb-3">
            <label for="nombre_cliente" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre_cliente" name="nombre_cliente" 
                   value="{{ reserva.nombre_cliente }}" required>
        </div>

        <div class="mb-3">
            <label for="telefono" class="form-label">Teléfono</label>
            <input type="tel" class="form-control" id="telefono" name="telefono" 
                   value="{{ reserva.telefono }}" required>
        </div>

        <div class="mb-3">
            <label for="servicio" class="form-label">Servicio</label>
            <select class="form-select" id="servicio" name="servicio" required>
                <option value="Maquillaje Profesional" 
                    {% if reserva.servicio == 'Maquillaje Profesional' %}selected{% endif %}>
                    Maquillaje Profesional
                </option>
                <option value="Asesoría Personalizada" 
                    {% if reserva.servicio == 'Asesoría Personalizada' %}selected{% endif %}>
                    Asesoría Personalizada
                </option>
                <option value="Tratamientos Capilares" 
                    {% if reserva.servicio == 'Tratamientos Capilares' %}selected{% endif %}>
                    Tratamientos Capilares
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label for="fecha" class="form-label">Fecha</label>
            <input type="date" class="form-control" id="fecha" name="fecha" 
                   value="{{ reserva.fecha }}" required>
        </div>

        <div class="mb-3">
            <label for="hora" class="form-label">Hora</label>
            <input type="time" class="form-control" id="hora" name="hora" 
                   value="{{ reserva.hora }}" required>
        </div>

        <button type="submit" class="btn btn-success">Guardar Cambios</button>
        <a href="{{ url_for('ver_reservas') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
