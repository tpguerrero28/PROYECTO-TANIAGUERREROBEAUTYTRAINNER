{% extends "base.html" %}

{% block title %}Reserva{% endblock %}

{% block content %}
<div class="text-center mb-5">
    <h2>Reserva tu cita</h2>
    <p class="lead">Completa el formulario para reservar tu servicio.</p>
</div>

<form>
    <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="nombre" placeholder="Tu nombre">
    </div>
    <div class="mb-3">
        <label for="telefono" class="form-label">Teléfono</label>
        <input type="tel" class="form-control" id="telefono" placeholder="Tu teléfono">
    </div>
    <div class="mb-3">
        <label for="servicio" class="form-label">Servicio</label>
        <select class="form-select" id="servicio">
            <option selected>Selecciona un servicio</option>
            <option value="1">Maquillaje Profesional</option>
            <option value="2">Entrenamiento Personal</option>
            <option value="3">Cuidado de la Piel</option>
        </select>
    </div>
    <div class="mb-3">
        <label for="fecha" class="form-label">Fecha</label>
        <input type="date" class="form-control" id="fecha">
    </div>
    <div class="mb-3">
        <label for="hora" class="form-label">Hora</label>
        <input type="time" class="form-control" id="hora">
    </div>
    <button type="submit" class="btn btn-custom">Reservar</button>
</form>
{% endblock %}
