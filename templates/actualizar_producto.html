{% extends "base.html" %}

{% block title %}Actualizar Producto{% endblock %}

{% block content %}
<div class="text-center mb-5">
    <h2>Actualizar Producto</h2>
    <p class="lead">Modifica los detalles de tus productos en el inventario.</p>
</div>

<form>
    <div class="mb-3">
        <label for="nombre" class="form-label">Nombre del Producto</label>
        <input type="text" class="form-control" id="nombre" placeholder="Nombre del producto">
    </div>
    <div class="mb-3">
        <label for="descripcion" class="form-label">Descripción</label>
        <textarea class="form-control" id="descripcion" rows="3" placeholder="Descripción del producto"></textarea>
    </div>
    <div class="mb-3">
        <label for="precio" class="form-label">Precio</label>
        <input type="number" class="form-control" id="precio" placeholder="Precio en USD">
    </div>
    <div class="mb-3">
        <label for="imagen" class="form-label">Imagen</label>
        <input type="file" class="form-control" id="imagen">
    </div>
    <button type="submit" class="btn btn-custom">Actualizar</button>
</form>
{% endblock %}
